server {
    listen 8085;
    server_name localhost;

    root /vps/mdz-develop/millionaire-dizital-structured;
    index index.html;

    # Allow large media file uploads (images and 4K videos up to 250MB)
    client_max_body_size 250M;

    # Gzip & Brotli Compression
    gzip on;
    gzip_vary on;
    gzip_min_length 256;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;

    # Security & Best Practices Headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Admin API Reverse Proxy to Python Media Admin Daemon (Port 8086)
    location /api/admin/ {
        proxy_pass http://127.0.0.1:8086;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 250M;
    }

    # Admin Panel UI Entry Point
    location = /admin {
        try_files /admin.html =404;
        add_header Cache-Control "no-cache, no-store, must-revalidate, max-age=0" always;
    }

    # Static assets (images, fonts, media)
    location ~* \.(png|jpg|jpeg|gif|ico|svg|mp4|mov|webm|webp|woff2|woff)$ {
        expires 1h;
        add_header Cache-Control "public, max-age=3600";
        add_header X-Content-Type-Options "nosniff" always;
    }

    # CSS and JS - instant revalidation so updates show immediately
    location ~* \.(js|css)$ {
        expires -1;
        add_header Cache-Control "no-cache, no-store, must-revalidate, max-age=0" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    location / {
        try_files $uri $uri/ $uri.html /index.html;
        add_header Cache-Control "no-cache, no-store, must-revalidate, max-age=0" always;
    }
}
